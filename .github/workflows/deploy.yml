name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:${{ inputs.environment }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ${{ inputs.environment }}
    needs: image
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      # Hosting target is environment-specific: configure DEPLOY_HOOK_URL as an
      # environment secret (e.g. a Render/Railway/Fly deploy hook, or your own
      # endpoint that pulls the tag and runs `docker compose up -d`). The image
      # runs `prisma migrate deploy` on boot, and the compose `scheduler`
      # service must be deployed alongside the app.
      - name: Trigger deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::DEPLOY_HOOK_URL secret is not configured for '${{ inputs.environment }}'. Image ${IMAGE}:${TAG} was pushed but not deployed."
            exit 1
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL" \
            -H 'content-type: application/json' \
            -d "{\"image\":\"${IMAGE}:${TAG}\",\"environment\":\"${{ inputs.environment }}\"}"
