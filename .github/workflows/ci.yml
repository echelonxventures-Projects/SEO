name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24' # matches the Dockerfile runtime
  NEXT_TELEMETRY_DISABLED: '1'
  # Non-secret placeholders: CI never touches real data or providers.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/omnimark_test
  APP_URL: http://localhost:3000
  OMNI_ENCRYPTION_KEYS: '{"1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}'
  OMNI_TOKEN_SECRET: ci-token-secret-ci-token-secret-ci-token
  CRON_SECRET: ci-cron-secret-0123456789abcdef

jobs:
  checks:
    name: Lint · typecheck · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # src/generated is gitignored — the Prisma client must be generated
      # before anything that imports it can typecheck or build.
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  smoke:
    name: Migrations + API smoke
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omnimark_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: production
      # Generous limits: the smoke suite issues hundreds of requests from one IP.
      OMNI_RATE_AUTH_PER_MIN: '1000'
      OMNI_RATE_API_PER_MIN: '5000'
      DEMO_EMAIL: ci-admin@example.test
      DEMO_PASSWORD: ci-Admin-Password-123
      OMNI_SEED_DEMO: '1'
      # The smoke suite's webhook/stream receivers listen on localhost.
      OMNI_ALLOW_PRIVATE_EGRESS: '1'
      BASE: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # NODE_ENV=production (job env) would make npm ci skip devDependencies,
      # but seed/smoke/migration scripts run under tsx.
      - run: npm ci --include=dev
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Schema drift (schema.prisma must match migrations)
        run: npm run db:drift
      - run: npm run db:seed
      - run: npm run build
      - name: Start server
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          (cd .next/standalone && PORT=3000 node server.js > ../../server.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/api/v1/health && break
            sleep 2
          done
      - run: npm run test:smoke
      - name: Scheduler drives every cron job
        run: CRON_ONCE=1 node scripts/cron-runner.mjs
      - name: Migration rollback
        run: npm run test:migration-rollback
      - name: Server log
        if: failure()
        run: tail -200 server.log
